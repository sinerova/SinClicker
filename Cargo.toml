[package]
name = "sinclicker"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
# The software renderer is enough for this small, mostly static window and
# uses far less memory than the GPU (femtovg/OpenGL) renderer.
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }


[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
